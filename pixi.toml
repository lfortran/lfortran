[workspace]
name = "lfortran"
version = "0.42.0"
description = "Modern interactive LLVM-based Fortran compiler"
authors = ["LFortran Maintainers <lfortran@groups.io>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64", "linux-64"]

[feature.test.tasks]
ctest = {cmd = 'ctest --test-dir "$LFORTRAN_BUILD_DIR" --output-on-failure', default-environment = "llvm11"}
tests = {cmd = 'python run_tests.py --require-llvm 11 --compiler-dir "$LFORTRAN_BUILD_DIR/src/bin" --build-dir "$LFORTRAN_BUILD_DIR/reference_tests"', default-environment = "llvm11"}
integration_tests = {cmd = 'python run_tests.py --build-dir "$LFORTRAN_BUILD_DIR/integration_tests" --compiler-dir "$LFORTRAN_BUILD_DIR/src/bin"', cwd = "integration_tests", default-environment = "llvm11"}

[feature.coarray-reference]
platforms = ["osx-arm64", "linux-64"]

[feature.coarray-reference.dependencies]
# OpenCoarrays rejects OpenMPI with GNU Fortran >=14 (the newer coarray ABI).
gfortran = "==13.4.0"
openmpi = "==5.0.6"
cmake = "==3.29.1"
make = "==4.4.1"

[feature.coarray-reference.target.linux-64.dependencies]
c-compiler = "==1.10.0"

[feature.coarray-reference.activation.env]
FC = "gfortran"

[feature.coarray-reference.target.osx-arm64.activation.env]
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"

[feature.coarray-reference.tasks]
opencoarrays-configure = {cmd = 'cmake -S OpenCoarrays -B OpenCoarrays/build -DCMAKE_Fortran_COMPILER="$CONDA_PREFIX/bin/gfortran" -DCMAKE_INSTALL_PREFIX="$PIXI_PROJECT_ROOT/OpenCoarrays/inst"'}
opencoarrays-build = {cmd = 'cmake --build OpenCoarrays/build -j2'}
opencoarrays-install = {cmd = 'cmake --install OpenCoarrays/build'}
caf = {cmd = '"$PIXI_PROJECT_ROOT/OpenCoarrays/inst/bin/caf"'}
cafrun = {cmd = '"$PIXI_PROJECT_ROOT/OpenCoarrays/inst/bin/cafrun"'}

[feature.llvm7]
platforms = ["win-64", "linux-64"]
[feature.llvm7.target.linux-64.dependencies]
llvmdev = "==7.0.1"
clangdev = "==7.0.1"
[feature.llvm7.target.win-64.dependencies]
llvmdev = "==7.0.1"
[feature.llvm8]
platforms = ["win-64", "linux-64"]
[feature.llvm8.target.linux-64.dependencies]
llvmdev = "==8.0.1"
clangdev = "==8.0.1"
[feature.llvm8.target.win-64.dependencies]
llvmdev = "==8.0.1"
[feature.llvm9]
platforms = ["win-64", "linux-64"]
[feature.llvm9.dependencies]
llvmdev = "==9.0.1"
[feature.llvm10]
platforms = ["win-64", "linux-64"]
[feature.llvm10.dependencies]
llvmdev = "==10.0.1"
[feature.llvm11.dependencies]
llvmdev = "==11.1.0"
kokkos = "==4.4.01"
[feature.llvm11.activation.env]
LFORTRAN_KOKKOS_DIR = "$CONDA_PREFIX"
[feature.llvm11.target.win-64.activation.env]
LFORTRAN_KOKKOS_DIR = "%CONDA_PREFIX%"
[feature.llvm11.target.osx-arm64.activation.env]
# GFortran emits M1/LSE instructions that LLVM 11's bundled Clang assembler
# rejects. Use the required Xcode tools without changing the LLVM version.
FC = "gfortran -B/usr/bin/"
[feature.llvm12.dependencies]
llvmdev = "==12.0.1"
[feature.llvm13.dependencies]
llvmdev = "==13.0.1"
[feature.llvm14.dependencies]
llvmdev = "==14.0.6"
[feature.llvm15.dependencies]
llvmdev = "==15.0.7"
[feature.llvm16.dependencies]
llvmdev = "==16.0.6"
[feature.llvm17.dependencies]
llvmdev = "==17.0.6"
[feature.llvm18.dependencies]
llvmdev = "==18.1.8"
[feature.llvm19.dependencies]
llvmdev = "==19.1.4"
[feature.llvm20.dependencies]
llvmdev = "==20.1.8"
[feature.llvm21.dependencies]
llvmdev = "==21.1.2"
[feature.llvm22.dependencies]
llvmdev = "==22.1.0"
[feature.llvm23.dependencies]
llvmdev = "==23.1.0"
[feature.llvm9.target.linux.dependencies]
clangdev = "==9.0.1"
[feature.llvm10.target.linux.dependencies]
clangdev = "==10.0.1"
[feature.llvm11.target.linux.dependencies]
clangdev = "==11.1.0"
[feature.llvm12.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==12.0.1"
[feature.llvm13.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==13.0.1"
[feature.llvm14.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==14.0.6"
[feature.llvm15.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==15.0.7"
[feature.llvm16.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==16.0.6"
[feature.llvm17.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==17.0.6"
[feature.llvm18.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==18.1.8"
[feature.llvm19.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==19.1.4"
[feature.llvm20.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==20.1.8"
[feature.llvm21.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==21.1.2"
[feature.llvm22.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==22.1.0"
[feature.llvm23.target.linux.dependencies]
libunwind = "==1.7.2"
clangdev = "==23.1.0"

# The MLIR backend, with the MLIR release of Quick's MLIR job. Build it with
# `pixi run -e mlir build -DWITH_MLIR=yes` (see doc/src/installation.md).
[feature.mlir]
platforms = ["linux-64"]
[feature.mlir.dependencies]
llvmdev = "==19.1.6"
mlir = "==19.1.6"
clangdev = "==19.1.6"
libunwind = "==1.7.2"

# The third-party applications of ci/test_third_party_codes.sh, which the
# Exhaustive compatibility jobs run with the apps<N> environments.
[feature.apps]
platforms = ["osx-arm64", "linux-64"]
[feature.apps.dependencies]
fypp = "==3.3"
openblas = "==0.3.34"
libblas = {version = "==3.11.0", build = "*openblas"}
liblapack = {version = "==3.11.0", build = "*openblas"}

# The MPI applications run on Linux only. Newer LLVM builds need a newer
# libxml2 than OpenMPI 5.0.6 allows, so this is a separate feature.
[feature.mpi]
platforms = ["linux-64"]
[feature.mpi.dependencies]
openmpi = "==5.0.6"

# The LAPACK application needs CMake >= 3.31, which recognizes LFortran. The
# build environments pin 3.29.1, which every LLVM environment can install.
[feature.cmake331]
platforms = ["osx-arm64", "linux-64"]
[feature.cmake331.dependencies]
cmake = "==3.31.2"

# Dependencies to build the project to be installed for the target architecture.
# host == target
[feature.build]
platforms = ["osx-arm64", "win-64", "linux-64"]

[feature.build.dependencies]
pytest = "==8.1.1"
jupyter = "==1.0.0"
xeus = "==6.0.6"
xeus-zmq = "==4.0.2"
nlohmann_json = "==3.12.0"
jupyter_kernel_test = "==0.7.0"
# The CI platform builds generate the man page and run the demo notebooks.
nbconvert = "==7.17.2"
pandoc = "==3.12.1"
numpy = "==1.26.4"
rapidjson = "==1.1.0"
# Different LLVM versions require different zlib and zstd versions.
zlib = "*"
zstd-static = ">=1.5.6,<2"
python = "==3.12"
cmake = "==3.29.1"
ninja = "==1.11.1"
re2c = "==3.1"
# Cross-platform Bash-compatible shell (https://github.com/prefix-dev/shell)
# that runs build0.sh and build1.sh on every platform, including native
# Windows. Builds without Pixi fall back to Bash (see CMakeLists.txt).
shell = "==0.3.0"

[feature.build.target.linux.dependencies]
c-compiler = "==2.0.0"
cxx-compiler = "==2.0.0"
gcc = "==15.3.0"
gxx = "==15.3.0"
# Each LLVM feature pins clangdev, which also supplies the Clang executable for
# LLVM 7 (it predates the separate Linux clang package). Native LLVM OpenMP
# uses LLVM's runtime.
llvm-openmp = "==23.1.4"

[feature.build.activation.env]
LFORTRAN_BUILD_DIR = "$PIXI_PROJECT_ROOT/build/$PIXI_ENVIRONMENT_NAME"

[feature.build.target.linux.activation.env]
PATH = "$PIXI_PROJECT_ROOT/build/$PIXI_ENVIRONMENT_NAME/src/bin:$PATH"

[feature.build.target.osx.activation.env]
PATH = "$PIXI_PROJECT_ROOT/build/$PIXI_ENVIRONMENT_NAME/src/bin:$PATH"
# LLVM's bundled clang may be older than the macOS SDK/linker.
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"
LFORTRAN_LINKER_PATH = "/usr/bin"

[feature.build.target.win.activation.env]
# Windows activation expands only %VAR% references.
LFORTRAN_BUILD_DIR = "%PIXI_PROJECT_ROOT%\\build\\%PIXI_ENVIRONMENT_NAME%"
PATH = "%PIXI_PROJECT_ROOT%\\build\\%PIXI_ENVIRONMENT_NAME%\\src\\bin;%PATH%"

# Dependencies to build the project to be installed on the build machine.
# feature.default.build-dependencies.
# These live in a feature (rather than in [dependencies]) so that the platform
# restriction below applies: the wasm-host environment adds the
# emscripten-wasm32 platform to the workspace, and an environment is only
# solved for the platforms shared by all of its features.
[feature.native]
platforms = ["osx-arm64", "win-64", "linux-64"]

[feature.native.dependencies]
python = "==3.12"


[feature.test]
platforms = ["osx-arm64", "win-64", "linux-64"]

[feature.test.dependencies]
python = "==3.12"
kokkos = "==4.4.01"
toml = "==0.10.2"
tomli = "==2.5.0"
edn_format = "==0.8.0"
cmake = "==3.29.1"
ninja = "==1.11.1"
# The LSP tests install their test packages with pip.
pip = "==26.2.2"

# The direct WASM backend runs its integration tests with Node. No Node build
# works with the older zlib that LLVM <= 10 and 12 require, so only the LLVM 11
# environments, which run these tests in CI, include it.
[feature.node]
platforms = ["osx-arm64", "win-64", "linux-64"]

[feature.node.dependencies]
nodejs = "==18.20.4"

[feature.test.target.linux.dependencies]
gfortran = "==15.3.0"
# Caffeine (ci/test_caffeine.sh) and the third-party applications build with fpm.
fpm = "==0.12.0"
make = "==4.4.1"

[feature.test.target.osx.dependencies]
gfortran = "==16.2.0"
# fpm 0.12.0 on macOS cannot be installed with GFortran 16.
fpm = "==0.13.0"
make = "==4.4.1"

[feature.build.target.unix.dependencies]
bison = "==3.4"

[feature.build.target.win.dependencies]
m2-bison = "==3.0.4"

[feature.build.tasks]
# Extra arguments are forwarded to CMake.
build = {cmd = 'shell --norc build1.sh "$LFORTRAN_BUILD_DIR"', default-environment = "llvm11"}
# Incremental: no reconfiguration, so generated sources are not rewritten.
rebuild = {cmd = 'cmake --build "$LFORTRAN_BUILD_DIR"', default-environment = "llvm11"}
start = {cmd = '"$LFORTRAN_BUILD_DIR/src/bin/lfortran"', default-environment = "llvm11"}
clean = {cmd = 'cmake --build "$LFORTRAN_BUILD_DIR" --target clean', default-environment = "llvm11"}

[feature.build.target.win.tasks]
build = {cmd = 'shell --norc build1.sh "$LFORTRAN_BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DWITH_STACKTRACE=no -DWITH_RUNTIME_STACKTRACE=no', default-environment = "llvm11"}

# ─── WASM kernel / JupyterLite ("lab") ───────────────────────────────────────
# See doc/src/jupyterlite.md. Three environments are involved:
#   wasm-build  native tools + Emscripten toolchain (runs the build scripts)
#   wasm-host   WASM *target* libraries (llvm, xeus, xeus-lite) and the runtime
#               .mod files; never executed on the host, only linked against
#   lite        jupyterlite-xeus, assembles and serves the site

[feature.wasm-build]
# The Emscripten cross toolchain is not published for win-64.
platforms = ["osx-arm64", "linux-64"]
channels = [
    "https://prefix.dev/emscripten-forge-4x",
    "https://prefix.dev/conda-forge",
]

[feature.wasm-build.dependencies]
cmake = "==4.4.4"
ninja = "==1.11.1"
emscripten_emscripten-wasm32 = "==4.0.9"
# python (for build0.sh) differs from the native environments: the emscripten
# toolchain requires >=3.13
python = "==3.15.1"
re2c = "==3.1"
# CMake runs build0.sh with it when LFORTRAN_BUILD_ALL=yes.
shell = "==0.3.0"

[feature.wasm-build.target.unix.dependencies]
bison = "==3.4"

[feature.wasm-host]
channels = [
    "https://prefix.dev/emscripten-forge-4x",
    "https://prefix.dev/conda-forge",
]
platforms = ["emscripten-wasm32"]

[feature.wasm-host.dependencies]
xeus-lite = "==5.0.0"
xeus = "==6.0.5"
nlohmann_json = "==3.12.0"
llvm = "==22.1.8"

[feature.lite]
platforms = ["osx-arm64", "linux-64"]

[feature.lite.dependencies]
python = "==3.12"
jupyter_server = "==2.21.1"
jupyterlite-xeus = "==5.1.0"

# The wasm-host environment targets emscripten-wasm32, which this machine
# cannot run, so pixi only installs it when asked for that platform explicitly.
[feature.wasm-build.tasks.wasm-host-env]
cmd = "pixi install -e wasm-host --platform emscripten-wasm32"

# Build the runtime .mod files with a native lfortran and install them into the
# wasm-host environment. Only needed again after changes under src/runtime/.
# It rebuilds a native lfortran from scratch, so it is cached on its inputs.
[feature.wasm-build.tasks.wasm-mods]
cmd = "./wasm-build0.sh"
env = { PREFIX = "$PIXI_PROJECT_ROOT/.pixi/envs/wasm-host" }
depends-on = ["wasm-host-env"]
inputs = ["src/runtime/**", "wasm-build0.sh", "build0.sh", "grammar/**"]

# Cross-compile LFortran and the xlfortran kernel to WebAssembly.
[feature.wasm-build.tasks.wasm-kernel]
cmd = "./wasm-build1.sh"
env = { PREFIX = "$PIXI_PROJECT_ROOT/.pixi/envs/wasm-host" }
depends-on = ["wasm-mods"]
inputs = [
    "src/**/*.cpp",
    "src/**/*.h",
    "src/**/*.hpp",
    "src/**/*.f90",
    "src/**/CMakeLists.txt",
    "CMakeLists.txt",
    "cmake/**",
    "wasm-build1.sh",
]
# Outputs must live outside .pixi/, which pixi's glob walker skips.
outputs = [
    "build-wasm/xlfortran.js",
    "build-wasm/xlfortran.wasm",
    "build-wasm/xlfortran.data",
]

# Run the evaluator test-suite inside the WASM runtime, as CI does.
[feature.wasm-build.tasks.wasm-test]
cmd = "node test_lfortran.js"
cwd = "build-wasm/src/lfortran/tests"
depends-on = ["wasm-kernel"]

# Assemble the JupyterLite site into dist/, embedding the kernel and the demo
# notebooks. default_channels has to be given explicitly: jupyterlite-xeus
# otherwise reads the channels out of the prefix's conda-meta/history, which
# pixi (unlike micromamba) does not write.
[feature.lite.tasks.lab-build]
cmd = "jupyter lite build --XeusAddon.prefix=$PREFIX --XeusAddon.default_channels=https://prefix.dev/emscripten-forge-4x --XeusAddon.default_channels=https://prefix.dev/conda-forge --contents share/lfortran/nb/Demo1.ipynb --contents share/lfortran/nb/Demo2.ipynb --contents share/lfortran/nb/Variables.ipynb --contents share/lfortran/nb/Mandelbrot.ipynb --contents share/lfortran/nb/Rich_Display.ipynb --contents share/lfortran/nb/Plot.ipynb --output-dir dist"
env = { PREFIX = "$PIXI_PROJECT_ROOT/.pixi/envs/wasm-host" }
depends-on = [{ task = "wasm-kernel", environment = "wasm-build" }]
inputs = [
    "build-wasm/xlfortran.js",
    "build-wasm/xlfortran.wasm",
    "build-wasm/xlfortran.data",
    "share/lfortran/nb/*.ipynb",
]
outputs = ["dist/xeus/wasm-host/bin/xlfortran.js"]

# Serve the site at http://127.0.0.1:8000/lab/index.html.
# ci/lite_server.py (not `python -m http.server`) because the kernel needs the
# page to be cross-origin isolated; see the comments there.
[feature.lite.tasks.lab]
cmd = "python ci/lite_server.py -d dist 8000"
depends-on = ["lab-build"]

[environments]
default = {features = ["native"]}
llvm7 = {features = ["llvm7", "build", "test"]}
llvm8 = {features = ["llvm8", "build", "test"]}
llvm9 = {features = ["llvm9", "build", "test"]}
llvm10 = {features = ["llvm10", "build", "test"]}
llvm11 = {features = ["llvm11", "build", "test", "node"]}
llvm12 = {features = ["llvm12", "build", "test"]}
llvm13 = {features = ["llvm13", "build", "test"]}
llvm14 = {features = ["llvm14", "build", "test"]}
llvm15 = {features = ["llvm15", "build", "test"]}
llvm16 = {features = ["llvm16", "build", "test"]}
llvm17 = {features = ["llvm17", "build", "test"]}
llvm18 = {features = ["llvm18", "build", "test"]}
llvm19 = {features = ["llvm19", "build", "test"]}
llvm20 = {features = ["llvm20", "build", "test"]}
llvm21 = {features = ["llvm21", "build", "test"]}
llvm22 = {features = ["llvm22", "build", "test"]}
llvm23 = {features = ["llvm23", "build", "test"]}
mlir = {features = ["mlir", "build", "test"]}
apps11 = {features = ["llvm11", "build", "test", "node", "apps", "mpi"]}
apps19 = {features = ["llvm19", "build", "test", "apps", "mpi"]}
apps22 = {features = ["llvm22", "build", "test", "apps"]}
cmake331 = {features = ["cmake331"], no-default-feature = true}
test = {features = ["llvm11", "build", "test", "node"]}
wasm-build = {features = ["wasm-build"], no-default-feature = true}
wasm-host = {features = ["wasm-host"], no-default-feature = true}
lite = {features = ["lite"], no-default-feature = true}
coarray-reference = {features = ["native", "coarray-reference"], no-default-feature = true}
