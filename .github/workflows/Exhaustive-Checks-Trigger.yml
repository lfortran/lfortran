name: Exhaustive checks

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    branches:
      - main


# 4 possibilities:
# (label is null, label is Tests::Run-Exhaustive)
# (0, 0) : a label event for some other label      --> FALSE
# (0, 1) : a label event for Tests::Run-Exhaustive --> TRUE
# (1, 0) : no label at all (push/synchronize/...)  --> TRUE
# (1, 1) : not possible
#
# Only 2 groups -- i.e.
# 1: Exhaustive checks-123true
# 2: Exhaustive checks-123false
#
# push/synchronize keep group 1, so a new commit still supersedes a running
# suite, and removing the label also keeps group 1, so it still stops one.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.number || github.sha }}${{
    github.event.label.name == null
    || github.event.label.name == 'Tests::Run-Exhaustive' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exhaustive:
    # push                               -> run (every merge to main)
    # opened/reopened/synchronize        -> run when the PR carries the label
    # labeled with Tests::Run-Exhaustive -> run (the manual trigger)
    # any other labeled/unlabeled event  -> skip
    if: >-
      ${{ github.event_name == 'push' ||
          (contains(github.event.pull_request.labels.*.name, 'Tests::Run-Exhaustive') &&
           (github.event.action == 'reopened' ||
            github.event.action == 'opened' ||
            github.event.action == 'synchronize')) ||
          (github.event.label.name == 'Tests::Run-Exhaustive' &&
           github.event.action == 'labeled') }}
    # A called workflow can only reduce the caller's permissions, so grant the
    # union of what its jobs declare: 
    #  - packages:write for build-and-push-image,
    #  - pages:write + id-token:write for deploy_jupyterlite.
    permissions:
      contents: read
      packages: write
      pages: write
      id-token: write
    secrets: inherit # upload_docs needs SSH_PRIVATE_KEY_DOCS.
    uses: ./.github/workflows/Exhaustive-Checks-CI.yml
