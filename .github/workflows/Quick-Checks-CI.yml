name: Quick checks

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Main pushes share one group: a running main run is never cancelled, and a
# newer push replaces the pending one, so the latest main is always tested.
# PRs cancel superseded runs; tags and manual runs stay independent per commit.
concurrency:
  group: quick-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  MACOSX_DEPLOYMENT_TARGET: 26.0

jobs:
  Build:
    name: LFortran CI (OS=${{ matrix.os }}, LLVM=${{ matrix.llvm-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 60 || matrix.os == 'macos-latest' && 150 || 90 }}
    env:
      LFORTRAN_TEST_SUITE: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same platform smoke and full CPU mode coverage runs on all
          # events. Exhaustive adds full normal/fast platform suites.
          - os: macos-latest
            llvm-version: "11"
          - os: ubuntu-latest
            llvm-version: "11"
          - os: ubuntu-latest
            llvm-version: "21"
          - os: windows-2025
            llvm-version: "11"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build platform compiler
        uses: ./.github/actions/build-platform
        with:
          os: ${{ matrix.os }}
          llvm-version: ${{ matrix.llvm-version }}

      # we need to run this only once for debugging purpose
      - name: Print github concurrent group name
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        run: |
          echo "Concurrency Group: quick-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || github.event.number || github.sha }}"
          echo "Cancel-in-progress: ${{ github.event_name == 'pull_request' }}"

      - name: Test (Linux / macOS)
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')
        run: |
            case "$OSTYPE" in darwin*) export MACOS=1;; *) export MACOS=0;; esac
            export LFORTRAN_LLVM_VERSION=${{ matrix.llvm-version }}
            export LFORTRAN_TEST_ENV_VAR='STATUS OK!'
            shell ci/test.sh

      - name: Test LFortran's Command Line Interface (Linux / macOS)
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')
        run: |
            ./test_lfortran_cmdline

      - name: Test full descriptor modes
        if: matrix.os == 'ubuntu-latest' && matrix.llvm-version == '21'
        shell: bash -e {0}
        run: |
            export PATH="$(pwd)/src/bin:$PATH"
            export LFORTRAN_LLVM_VERSION="${{ matrix.llvm-version }}"
            bash ci/test_llvm_integration.sh --options

      - name: Test Metal GPU backend (macOS)
        shell: bash -e {0}
        if: contains(matrix.os, 'macos')
        run: |
            pixi run -e llvm${{ matrix.llvm-version }} integration_tests -b metal -j3

      # The CUDA device code is compiled and run on the CPU, so this exercises
      # the whole CUDA path on a runner that has no GPU.
      - name: Test CUDA GPU backend on the CPU (Linux / macOS)
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')
        run: |
            pixi run -e llvm${{ matrix.llvm-version }} integration_tests -b cuda_cpu -j3

      - name: Test (Windows)
        if: contains(matrix.os, 'windows')
        shell: cmd
        run: |
            set WIN=1
            set MACOS=0
            for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do (
                call "%%i\VC\Auxiliary\Build\vcvars64.bat"
            )
            set CC=cl.exe
            set CXX=cl.exe
            set "PATH=%PATH:C:\mingw64\bin;=%"
            shell ci\test.sh

      - name: LSP Test (Linux / macOS)
        shell: bash -e {0}
        if: (contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')) && contains(matrix.llvm-version, '11')
        timeout-minutes: 5
        env:
            EXIT_SUCCESS: 0
            EXIT_TIMEOUT: 124
            EXIT_KILL: 137
            MAX_ATTEMPTS: 3
            SIGTERM_TIMEOUT: 60s
            SIGKILL_TIMEOUT: 10s
            PYTEST_TIMEOUT: 10
        run: |
            set -ex
            timeout -k $SIGKILL_TIMEOUT $SIGTERM_TIMEOUT \
                pixi run -e llvm11 lsp_tests -vv \
                    --showlocals \
                    --timeout=$PYTEST_TIMEOUT \
                    --execution-strategy="concurrent"
            set +e
            for (( ATTEMPT = 1; ATTEMPT <= MAX_ATTEMPTS; ATTEMPT++ )); do
                echo "Attempt $ATTEMPT of $MAX_ATTEMPTS"
                timeout -k $SIGKILL_TIMEOUT $SIGTERM_TIMEOUT \
                    pixi run -e llvm11 lsp_tests -vv \
                        --showlocals \
                        --timeout=$PYTEST_TIMEOUT \
                        --execution-strategy="parallel"
                EXIT_CODE=$?
                if [ $EXIT_CODE -eq $EXIT_SUCCESS ]; then
                    break
                fi
                echo "Command failed with exit code: $EXIT_CODE" 1>&2
            done
            set -e
            exit $EXIT_CODE

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test integration_tests with GFortran
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            pixi run -e llvm11 integration_tests -b gfortran

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test OpenMP
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            pixi run -e llvm11 integration_tests -b llvm_omp
      
      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test Fortran Backend
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            pixi run -e llvm11 integration_tests -b fortran -j1
            pixi run -e llvm11 integration_tests -b fortran -f -j1

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test C/C++ Backend
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            pixi run -e llvm11 integration_tests -b cpp c c_nopragma
            pixi run -e llvm11 integration_tests -b cpp c c_nopragma -f

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Show Node Info
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
          set -ex
          which node
          node --version

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test WASM backend
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            pixi run -e llvm11 integration_tests -b wasm
            pixi run -e llvm11 integration_tests -b wasm -f

      - name: Test CI smoke selection
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        shell: bash -e {0}
        run: python ci/test_ci.py

      - name: Check Bison Grammar for Essential Conflicts
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        shell: bash -e {0}
        run: |
          ./ci/grammar_conflicts.sh

      # Run last among history checks. Binary script checks out commits in PR history.
      - name: Check for Added Binary Files
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        run: |
          python3 check_binary_file_in_git_history.py

      # Human-only commit authorship: no AI author/committer/Co-Authored-By stamps.
      # Does not rewrite the working tree; safe after the binary-file history check.
      - name: Check for AI Commit Authorship
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        run: |
          python3 check_ai_commit_authorship.py

  compatibility:
    name: Compiler compatibility
    uses: ./.github/workflows/Compiler-Compatibility-CI.yml
    with:
      scope: quick

  # Preserve the public check names when moving these jobs out of the shared workflow.
  # The two LLVM WASM backends run in parallel jobs: the Emscripten pass alone
  # takes about as long as the WASI pass plus building the compiler, because
  # every emcc link runs Emscripten's JavaScript compiler.
  test_llvm_wasm:
    name: Compiler compatibility / Test LLVM 19 WASM${{ matrix.suffix }} (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: llvm_wasm
            suffix: ""
          - backend: llvm_wasm_emcc
            suffix: " Emscripten"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: llvm19-wasm
          cache: false

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          # The Pixi builds share no cache entries with the micromamba ones.
          key: ${{ github.job }}-pixi-ubuntu-latest-19-o2
          # Both jobs build the same compiler; one copy of the cache is enough.
          save: ${{ github.ref == 'refs/heads/main' && matrix.backend == 'llvm_wasm' }}

      # The WASI SDK, wasmtime and emsdk releases (ci/wasm_tools.sh).
      - name: Install WASM toolchains
        shell: bash -e {0}
        run: pixi run -e llvm19-wasm wasm-tools

      - name: Build Linux ( WASM )
        shell: bash -e {0}
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
            export CXXFLAGS="-Werror -D_GLIBCXX_ASSERTIONS"
            # A Debug build (assertions and per-pass ASR verification, no
            # NDEBUG) compiled with -O2, like Quick's LLVM 11 compiler: each
            # test spends about half as long in LFortran. See that job for
            # -Wno-mismatched-new-delete.
            pixi run -e llvm19-wasm build \
              -DCMAKE_BUILD_TYPE=Debug \
              "-DCMAKE_CXX_FLAGS_DEBUG=-Wall -Wextra -O2 -Wno-mismatched-new-delete" \
              "-DCMAKE_C_FLAGS_DEBUG=-O2" \
              -DWITH_LSP=yes \
              -DWITH_TARGET_WASM=yes \
              -DWITH_STACKTRACE=no

      - name: Test unit tests
        if: matrix.backend == 'llvm_wasm'
        shell: bash -e {0}
        run: pixi run -e llvm19-wasm ctest

      - name: Test Linux ( WASM )
        shell: bash -e {0}
        run: pixi run -e llvm19-wasm integration_tests -b ${{ matrix.backend }}

  test_without_llvm:
    name: Compiler compatibility / Test without LLVM Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: nollvm
          cache: false

      - name: Test
        shell: bash -e {0}
        run: pixi run -e nollvm shell ci/test_without_llvm_backend.sh

  test_mlir:
    name: Compiler compatibility / Test MLIR backend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: mlir
          cache: false

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          # The Pixi builds share no cache entries with the micromamba ones.
          key: ${{ github.job }}-pixi-ubuntu-latest
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Build Linux
        shell: bash -e {0}
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: pixi run -e mlir build -DWITH_MLIR=yes -DWITH_LSP=yes -DWITH_STACKTRACE=no

      - name: Test unit tests
        shell: bash -e {0}
        run: pixi run -e mlir ctest

      - name: Test Linux
        shell: bash -e {0}
        run: pixi run -e mlir integration_tests -b mlir -j1

  build_to_wasm_and_upload:
    name: Build LFortran to WASM
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # llvm11 builds the native compiler; wasm-build has Emscripten 4.
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: llvm11 wasm-build
          cache: false

      # ccache wraps both the native compiler and em++ (Emscripten documents
      # `ccache emcc`). The cache holds both builds. The Pixi builds share no
      # cache entries with the micromamba ones.
      - uses: hendrikmuhs/ccache-action@main
        with:
          key: ${{ github.job }}-pixi-ubuntu-latest
          max-size: 1500M
          save: ${{ github.ref == 'refs/heads/main' }}

      - name: Show Emscripten and Node Info
        shell: bash -e {0}
        run: |
            set -x
            pixi run -e wasm-build emcc -v
            pixi run -e wasm-build em++ -v
            pixi run -e wasm-build node -v

      # Phase 1: Native build. This is Quick's only Linux GCC Release (NDEBUG)
      # build, so it uses -Werror and the LSP/runtime-stacktrace options of
      # Exhaustive's "Check Release build": the Debug builds cannot catch
      # warnings such as variables used only in assertions.
      - name: Build native LFortran
        shell: bash -e {0}
        run: |
            set -x
            export CXXFLAGS="-Werror"
            export CFLAGS="-Werror"
            pixi run -e llvm11 build \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_LSP=yes \
                -DWITH_STACKTRACE=no \
                -DWITH_RUNTIME_STACKTRACE=yes \
                -DWITH_INTERNAL_ALLOC_CHECK=no \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            mkdir -p src/bin/asset_dir
            cp build/llvm11/src/runtime/*.mod src/bin/asset_dir
            # Keep the compiler cache and the Pixi environments, which live
            # in the workspace.
            git clean -dfx -e src/bin/asset_dir -e .ccache -e .pixi

      # Phase 2: Emscripten WASM build, in the source tree for the upload.
      # It uses Makefiles: em++ resolves `--preload-file asset_dir` from
      # src/bin/, where Make (unlike Ninja) runs the link.
      - name: Build to WASM
        shell: bash -e {0}
        run: |
            set -x
            pixi run -e wasm-build bash -c '
              set -ex
              emcmake cmake \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_CXX_FLAGS_DEBUG="-Wall -Wextra -fexceptions" \
                  -DCMAKE_CXX_FLAGS_RELEASE="-Wall -Wextra -fexceptions" \
                  -DWITH_LLVM=no \
                  -DLFORTRAN_BUILD_ALL=yes \
                  -DLFORTRAN_BUILD_TO_WASM=yes \
                  -DWITH_STACKTRACE=no \
                  -DWITH_LSP=no \
                  -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH_LFORTRAN;$CONDA_PREFIX" \
                  -DCMAKE_INSTALL_PREFIX=$(pwd)/inst \
                  -DCMAKE_EXPORT_COMPILE_COMMANDS=yes \
                  -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                  -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                  .
              cmake --build . -j$(nproc)
            '

      - name: Test built lfortran.wasm
        shell: bash -e {0}
        run: pixi run -e wasm-build node src/lfortran/tests/test_lfortran.js

      - name: Upload to wasm_builds
        if: github.event_name == 'push'
        shell: bash -e {0}
        run: pixi run -e wasm-build ci/upload_lfortran_wasm.sh
        env:
          SSH_PRIVATE_KEY_WASM_BUILDS: ${{ secrets.SSH_PRIVATE_KEY_WASM_BUILDS }}
