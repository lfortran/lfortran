name: Quick checks

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Main runs stay independent per commit; only superseded PR runs are cancelled.
# Manual runs use a commit SHA, distinct from ordinary PR concurrency groups.
concurrency:
  group: quick-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


env:
  MACOSX_DEPLOYMENT_TARGET: 26.0

jobs:
  Build:
    name: LFortran CI (OS=${{ matrix.os }}, LLVM=${{ matrix.llvm-version }})
    runs-on: ${{ matrix.os }}
    env:
      LFORTRAN_TEST_SUITE: smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same platform smoke and full CPU mode coverage runs on all
          # events. Exhaustive adds full normal/fast platform suites.
          - os: macos-latest
            llvm-version: "11"
          - os: ubuntu-latest
            llvm-version: "11"
          - os: ubuntu-latest
            llvm-version: "21"
          - os: windows-2025
            llvm-version: "11"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build platform compiler
        uses: ./.github/actions/build-platform
        with:
          os: ${{ matrix.os }}
          llvm-version: ${{ matrix.llvm-version }}

      # we need to run this only once for debugging purpose
      - name: Print github concurrent group name
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        run: |
          echo "Concurrency Group: quick-${{ github.event.number || github.sha }}"
          echo "Cancel-in-progress: ${{ github.event_name == 'pull_request' }}"

      - name: Test (Linux / macOS)
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')
        run: |
            case "$OSTYPE" in darwin*) export MACOS=1;; *) export MACOS=0;; esac
            export LFORTRAN_LLVM_VERSION=${{ matrix.llvm-version }}
            export LFORTRAN_TEST_ENV_VAR='STATUS OK!'
            shell ci/test.sh

      - name: Test LFortran's Command Line Interface (Linux / macOS)
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')
        run: |
            ./test_lfortran_cmdline

      - name: Test full descriptor modes
        if: matrix.os == 'ubuntu-latest' && matrix.llvm-version == '21'
        shell: bash -e -l {0}
        run: |
            export PATH="$(pwd)/src/bin:$PATH"
            export LFORTRAN_LLVM_VERSION="${{ matrix.llvm-version }}"
            bash ci/test_llvm_integration.sh --options

      - name: Test Metal GPU backend (macOS)
        shell: bash -e -l {0}
        if: contains(matrix.os, 'macos')
        run: |
            cd ./integration_tests
            ./run_tests.py -b metal -j3

      # The CUDA device code is compiled and run on the CPU, so this exercises
      # the whole CUDA path on a runner that has no GPU.
      - name: Test CUDA GPU backend on the CPU (Linux / macOS)
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')
        run: |
            cd ./integration_tests
            ./run_tests.py -b cuda_cpu -j3

      - name: Test (Windows)
        if: contains(matrix.os, 'windows')
        shell: cmd
        run: |
            set MAMBA_INSTALL_LOCN=C:\\Users\runneradmin\micromamba
            call %MAMBA_INSTALL_LOCN%\Scripts\activate.bat
            call micromamba activate lf
            set LFORTRAN_CMAKE_GENERATOR=Ninja
            set WIN=1
            set MACOS=0
            set ENABLE_RUNTIME_STACKTRACE=no
            for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do (
                call "%%i\VC\Auxiliary\Build\vcvars64.bat"
            )
            set CC=cl.exe
            set CXX=cl.exe
            set "PATH=%PATH:C:\mingw64\bin;=%"
            shell ci\test.sh

      - name: Install Timeout (macOS)
        shell: bash -e -l {0}
        if: contains(matrix.os, 'macos')
        run: brew install coreutils

      # ~/.bash_logout wanted to run `/usr/bin/clear_console -q` while exiting
      # login shells which frequently erred on ubuntu-latest since the shell was
      # not run interactively.
      - name: Disable ~/.bash_logout (Linux)
        shell: bash -e {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: mv -v ~/.bash_logout ~/.bash_logout.bak

      - name: LSP Test (Linux / macOS)
        shell: bash -e -l {0}
        if: (contains(matrix.os, 'ubuntu') || contains(matrix.os, 'macos')) && contains(matrix.llvm-version, '11')
        timeout-minutes: 5
        env:
            EXIT_SUCCESS: 0
            EXIT_TIMEOUT: 124
            EXIT_KILL: 137
            MAX_ATTEMPTS: 3
            SIGTERM_TIMEOUT: 60s
            SIGKILL_TIMEOUT: 10s
            PYTEST_TIMEOUT: 10
        run: |
            set -ex
            pip install src/server/tests tests/server
            timeout -k $SIGKILL_TIMEOUT $SIGTERM_TIMEOUT \
                pytest -vv \
                    --showlocals \
                    --timeout=$PYTEST_TIMEOUT \
                    --execution-strategy="concurrent" \
                    tests/server
            set +e
            for (( ATTEMPT = 1; ATTEMPT <= MAX_ATTEMPTS; ATTEMPT++ )); do
                echo "Attempt $ATTEMPT of $MAX_ATTEMPTS"
                timeout -k $SIGKILL_TIMEOUT $SIGTERM_TIMEOUT \
                    pytest -vv \
                        --showlocals \
                        --timeout=$PYTEST_TIMEOUT \
                        --execution-strategy="parallel" \
                        tests/server
                EXIT_CODE=$?
                if [ $EXIT_CODE -eq $EXIT_SUCCESS ]; then
                    break
                fi
                echo "Command failed with exit code: $EXIT_CODE" 1>&2
            done
            set -e
            exit $EXIT_CODE

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test integration_tests with GFortran
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            cd integration_tests
            ./run_tests.py -b gfortran

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test OpenMP
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            cd integration_tests
            ./run_tests.py -b llvm_omp
      
      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test Fortran Backend
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            cd integration_tests
            ./run_tests.py -b fortran -j1
            ./run_tests.py -b fortran -f -j1

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test C/C++ Backend
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            mkdir build-kokkos
            cd build-kokkos
            wget https://github.com/kokkos/kokkos/archive/3.1.01.tar.gz
            tar xaf 3.1.01.tar.gz
            cd kokkos-3.1.01
            mkdir build
            cd build
            export LFORTRAN_KOKKOS_DIR=$HOME/ext/kokkos
            cmake -DCMAKE_INSTALL_PREFIX=$LFORTRAN_KOKKOS_DIR -DKokkos_ENABLE_OPENMP=On -DKokkos_ARCH_HSW=On ..
            make
            make install
            cd ../../..

            cd integration_tests
            ./run_tests.py -b cpp c c_nopragma
            ./run_tests.py -b cpp c c_nopragma -f

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Show Node Info
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
          set -ex
          which node
          node --version

      - name: Test GFortran, Debug Build, Fortran, OpenMP, C/C++ backend, Upload Tarball, CPP Build, WASM - Test WASM backend
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '11')
        run: |
            cd integration_tests
            ./run_tests.py -b wasm
            ./run_tests.py -b wasm -f

      - name: Test CI smoke selection
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        shell: bash -e -l {0}
        run: python ci/test_ci.py

      - name: Check Bison Grammar for Essential Conflicts
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        shell: bash -e -l {0}
        run: |
          ./ci/grammar_conflicts.sh

      # Run last among history checks. Binary script checks out commits in PR history.
      - name: Check for Added Binary Files
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        run: |
          python3 check_binary_file_in_git_history.py

      # Human-only commit authorship: no AI author/committer/Co-Authored-By stamps.
      # Does not rewrite the working tree; safe after the binary-file history check.
      - name: Check for AI Commit Authorship
        shell: bash -e -l {0}
        if: contains(matrix.os, 'ubuntu') && contains(matrix.llvm-version, '21')
        run: |
          python3 check_ai_commit_authorship.py

  compatibility:
    name: Compiler compatibility
    uses: ./.github/workflows/Compiler-Compatibility-CI.yml
    with:
      scope: quick

  # Preserve the public check names when moving these jobs out of the shared workflow.
  test_llvm_wasm:
    name: Compiler compatibility / Test LLVM 19 WASM (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=3.10
            llvmdev=19
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            nodejs=18.20.4
            openmpi=5.0.6=hb85ec53_102
            xonsh=0.16.0
            zlib=1.3.1
            zstd-static=1.5.6

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          key: ${{ github.job }}-ubuntu-latest-19

      - name: Install libunwind
        run: micromamba install -y -n lf libunwind=1.7.2

      - name: Setup WASI SDK
        shell: bash -e -l {0}
        run: |
          mkdir -p $HOME/ext
          cd $HOME/ext
          curl -o wasi-sdk.tar.gz -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-21/wasi-sdk-21.0-linux.tar.gz
          tar -xvf wasi-sdk.tar.gz
          mv wasi-sdk-21.0 wasi-sdk
          export WASI_SDK_PATH=$HOME/ext/wasi-sdk
          echo $WASI_SDK_PATH
          $WASI_SDK_PATH/bin/clang --version

      - name: Install wasmtime
        shell: bash -e -l {0}
        run: |
          cd $HOME
          curl -o wasmtime.tar.gz -L https://github.com/bytecodealliance/wasmtime/releases/download/v19.0.2/wasmtime-v19.0.2-x86_64-linux.tar.xz
          tar -xvf wasmtime.tar.gz
          export PATH=$HOME/wasmtime-v19.0.2-x86_64-linux:$PATH
          wasmtime --version

      - name: Setup Emscripten SDK
        shell: bash -e -l {0}
        run: |
          mkdir -p $HOME/ext
          cd $HOME/ext
          curl -o emsdk.tar.gz -L https://github.com/emscripten-core/emsdk/archive/refs/tags/4.0.13.tar.gz
          tar -xvf emsdk.tar.gz
          mv emsdk-4.0.13 emsdk
          export EMSDK_PATH=$HOME/ext/emsdk
          echo $EMSDK_PATH
          cd $EMSDK_PATH
          ./emsdk install 3.1.35
          ./emsdk activate 3.1.35

      - name: Build Linux ( WASM )
        shell: bash -e -l {0}
        run: |
            export WASI_SDK_PATH=$HOME/ext/wasi-sdk
            export EMSDK_PATH=$HOME/ext/emsdk
            export CXXFLAGS="-Werror -D_GLIBCXX_ASSERTIONS"
            ./build0.sh
            cmake . -GNinja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DWITH_LLVM=yes \
              -DWITH_LSP=yes \
              -DWITH_TARGET_WASM=yes \
              -DLFORTRAN_BUILD_ALL=yes \
              -DWITH_STACKTRACE=no \
              -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
              -DCMAKE_INSTALL_PREFIX=`pwd`/inst \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

            cmake --build . -j16 --target install

      - name: Test unit tests
        shell: bash -e -l {0}
        run: ctest --output-on-failure

      - name: Test Linux ( WASM )
        shell: bash -e -l {0}
        run: |
            export WASI_SDK_PATH=$HOME/ext/wasi-sdk
            export EMSDK_PATH=$HOME/ext/emsdk
            export PATH=$HOME/wasmtime-v19.0.2-x86_64-linux:$PATH
            export WASMTIME_NEW_CLI=0
            cd integration_tests
            ./run_tests.py -b llvm_wasm llvm_wasm_emcc

  test_without_llvm:
    name: Compiler compatibility / Test without LLVM Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux.yml
          create-args: >-
            python=3.10

      - name: Test
        shell: bash -e -l {0}
        run: |
          shell ci/test_without_llvm_backend.sh

  test_mlir:
    name: Compiler compatibility / Test MLIR backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=3.10
            mlir=19.1.6
            llvm=19.1.6
            llvm-openmp=19.1.6
            libunwind=1.7.2

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          key: ${{ github.job }}-ubuntu-latest

      - name: Build Linux
        shell: bash -e -l {0}
        run: |
            ./build0.sh
            cmake . -GNinja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DWITH_LLVM=yes \
              -DWITH_LSP=yes \
              -DWITH_MLIR=yes \
              -DLFORTRAN_BUILD_ALL=yes \
              -DWITH_STACKTRACE=no \
              -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
              -DCMAKE_INSTALL_PREFIX=`pwd`/inst \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

            cmake --build . -j16 --target install

      - name: Test unit tests
        shell: bash -e -l {0}
        run: ctest --output-on-failure

      - name: Test Linux
        shell: bash -e -l {0}
        run: |
            cd integration_tests
            ./run_tests.py -b mlir -j1

  build_to_wasm_and_upload:
    name: Build LFortran to WASM
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux.yml
          create-args: >-
            python=3.10

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          key: ${{ github.job }}-${{ matrix.os }}

      # ── Set up Emscripten 4 from conda instead of outdated emsdk 3.1.35 ──
      - name: Install Emscripten 4 environment
        shell: bash -l {0}
        run: |
          set -ex
          micromamba create -f environment-wasm-build.yml -y
          micromamba install -n xeus-lfortran-wasm-build re2c bison -c conda-forge -y

      - name: Show Emscripten and Node Info
        shell: bash -l {0}
        run: |
            set -ex
            micromamba run -n xeus-lfortran-wasm-build emcc -v
            micromamba run -n xeus-lfortran-wasm-build em++ -v
            micromamba run -n xeus-lfortran-wasm-build node -v

      # Phase 1: Native build (needs re2c, bison, LLVM from lf env)
      - name: Build native LFortran
        shell: bash -l {0}
        run: |
            set -ex
            cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_LLVM=yes \
                -DLFORTRAN_BUILD_ALL=yes \
                -DWITH_STACKTRACE=no \
                -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH_LFORTRAN;$CONDA_PREFIX" \
                -DCMAKE_INSTALL_PREFIX=`pwd`/inst \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=yes \
                .
            cmake --build . -j$(nproc) --target install
            mkdir -p src/bin/asset_dir
            cp src/runtime/*.mod src/bin/asset_dir
            git clean -dfx -e src/bin/asset_dir

      # Phase 2: Emscripten WASM build (needs emcmake from wasm-build env)
      - name: Build to WASM
        shell: bash -l {0}
        run: |
            set -ex
            micromamba run -n xeus-lfortran-wasm-build bash -c '
              emcmake cmake \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DCMAKE_CXX_FLAGS_DEBUG="-Wall -Wextra -fexceptions" \
                  -DCMAKE_CXX_FLAGS_RELEASE="-Wall -Wextra -fexceptions" \
                  -DWITH_LLVM=no \
                  -DLFORTRAN_BUILD_ALL=yes \
                  -DLFORTRAN_BUILD_TO_WASM=yes \
                  -DWITH_STACKTRACE=no \
                  -DWITH_LSP=no \
                  -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH_LFORTRAN;$CONDA_PREFIX" \
                  -DCMAKE_INSTALL_PREFIX=$(pwd)/inst \
                  -DCMAKE_EXPORT_COMPILE_COMMANDS=yes \
                  .
              cmake --build . -j$(nproc)
            '

      - name: Test built lfortran.wasm
        shell: bash -l {0}
        run: |
            set -ex
            micromamba run -n xeus-lfortran-wasm-build node src/lfortran/tests/test_lfortran.js

      - name: Upload to wasm_builds
        if: github.event_name == 'push'
        shell: bash -l {0}
        run: |
            ci/upload_lfortran_wasm.sh
        env:
          SSH_PRIVATE_KEY_WASM_BUILDS: ${{ secrets.SSH_PRIVATE_KEY_WASM_BUILDS }}

  quick_status:
    # Keep the existing protection until every Quick job is required directly.
    name: Build LFortran to WASM and Upload
    needs: [Build, compatibility, test_llvm_wasm, test_without_llvm, test_mlir, build_to_wasm_and_upload]
    if: ${{ !cancelled() && vars.LFORTRAN_DIRECT_REQUIRED_CHECKS != 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all Quick checks
        env:
          BUILD_RESULT: ${{ needs.Build.result }}
          WASM_RESULT: ${{ needs.build_to_wasm_and_upload.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
          LLVM_WASM_RESULT: ${{ needs.test_llvm_wasm.result }}
          NO_LLVM_RESULT: ${{ needs.test_without_llvm.result }}
          MLIR_RESULT: ${{ needs.test_mlir.result }}
        run: |
          if [ "$BUILD_RESULT" != success ] || \
             [ "$COMPATIBILITY_RESULT" != success ] || \
             [ "$LLVM_WASM_RESULT" != success ] || \
             [ "$NO_LLVM_RESULT" != success ] || \
             [ "$MLIR_RESULT" != success ] || \
             [ "$WASM_RESULT" != success ]; then
            echo "::error::Not all Quick checks passed"
            exit 1
          fi
