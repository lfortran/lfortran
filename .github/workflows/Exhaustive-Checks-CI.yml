name: Exhaustive checks

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  # Exhaustive never runs on PRs. For a rare, explicitly requested check of a
  # PR, dispatch this workflow on the PR branch in a fork (see
  # doc/src/installation.md).
  workflow_dispatch:

# Main pushes share one group: a running main run is never cancelled, and a
# newer push replaces the pending one, so the latest main is always tested.
# Tags and manual runs stay independent per commit.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'main' || github.sha }}
  cancel-in-progress: false


env:
  MACOSX_DEPLOYMENT_TARGET: 15.0

jobs:
  compatibility:
    name: Extended compiler checks
    uses: ./.github/workflows/Compiler-Compatibility-CI.yml
    with:
      scope: exhaustive

  platform:
    name: Full platform coverage (OS=${{ matrix.os }}, LLVM=${{ matrix.llvm-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ contains(matrix.os, 'macos') && 130 || 60 }}
    env:
      MACOSX_DEPLOYMENT_TARGET: 26.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            llvm-version: "11"
          - os: ubuntu-latest
            llvm-version: "11"
          - os: ubuntu-latest
            llvm-version: "21"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build platform compiler
        uses: ./.github/actions/build-platform
        with:
          os: ${{ matrix.os }}
          llvm-version: ${{ matrix.llvm-version }}
          # Quick saves this cache. A second ~1.5 GB copy per platform pushed
          # the repository over its 10 GB cache limit and evicted other caches.
          save-cache: 'false'

      - name: Test full platform coverage
        shell: bash -e {0}
        run: |
            export PATH="$(pwd)/src/bin:$PATH"
            export LFORTRAN_LLVM_VERSION="${{ matrix.llvm-version }}"
            if [[ "${{ matrix.os }}" == *macos* ]]; then
                export MACOS=1 NPROC=3
                ./run_tests.py
            else
                export MACOS=0
            fi
            bash ci/test_llvm_integration.sh --platform

  # Besides the out-of-source configuration, this job builds the way a user
  # without Pixi does: the llvm11-noshell environment has no Prefix `shell`, so
  # CMake must run build0.sh with Bash, and the CI scripts run with Bash too.
  debug_outOfSource:
    name: Check Out-of-Source Debug build
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: src

      # The last step removes src/, and Test Moved Installation moves it.
      # Keep the Pixi environment outside the checkout.
      - name: Detach the Pixi environment from the checkout
        shell: bash -e {0}
        run: |
          printf 'detached-environments = "%s"\n' "$RUNNER_TEMP/pixi-envs" \
            > "$RUNNER_TEMP/pixi-config.toml"
          echo "PIXI_CONFIG_FILE=$RUNNER_TEMP/pixi-config.toml" >> "$GITHUB_ENV"

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          # The Pixi builds share no cache entries with the micromamba ones.
          key: ${{ github.job }}-pixi-ubuntu-latest
          save: ${{ github.ref == 'refs/heads/main' }}

      # After ccache-action, which prepends the runner's /usr/local/bin to PATH.
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          manifest-path: src/pixi.toml
          environments: llvm11-noshell
          activate-environment: llvm11-noshell
          cache: false

      - name: Check that the Prefix shell is absent
        shell: bash -e {0}
        run: |
            if command -v shell; then
                echo "shell is installed" && exit 1
            fi

      - name: Build Linux
        shell: bash -e {0}
        run: |
            # No explicit ./build0.sh: CMake must run it itself, with Bash.
            export CXXFLAGS="-Werror -D_GLIBCXX_ASSERTIONS"
            cmake -S src -B builddir -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS_RELEASE="-Wall -Wextra -O3 -funroll-loops -DNDEBUG" \
              -DWITH_LLVM=yes \
              -DWITH_LSP=yes \
              -DWITH_KOKKOS=yes \
              -DLFORTRAN_BUILD_ALL=yes \
              -DWITH_STACKTRACE=no \
              -DWITH_RUNTIME_STACKTRACE=yes \
              -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
              -DCMAKE_INSTALL_PREFIX=`pwd`/inst \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            grep '^LFORTRAN_SHELL:FILEPATH=.*/bash$' builddir/CMakeCache.txt

            cmake --build builddir  -j16 --target install

      - name: Test Linux
        shell: bash -e {0}
        run: ctest --output-on-failure
        working-directory: builddir

      - name: Test option combinations
        shell: bash -e {0}
        run: |
            export PATH="$(pwd)/inst/bin:$PATH"
            NPROC=$(nproc)
            cd src/integration_tests
            ./run_tests.py -b llvm -sc -j${NPROC}
            ./run_tests.py -b llvm_submodule -sc -j${NPROC}
            ./run_tests.py -b llvm --detect-leaks -j${NPROC}

      - name: Test C++ compiler build
        shell: bash -e {0}
        working-directory: src
        run: |
            bash ci/test_cpp_version.sh

      - name: Test Moved Installation
        shell: bash -e {0}
        run: |
          python3 src/ci/test_runtime_headers.py \
            --source-dir src --build-dir builddir --install-prefix inst \
            --kokkos-dir "$CONDA_PREFIX" --relocate
          mv inst inst.moved
          cp src/examples/expr2.f90 expr2.F90
          rm -rf src
          inst.moved/bin/lfortran expr2.F90 -o expr2
          ./expr2
          inst.moved/bin/lfortran --backend=c expr2.F90 -o expr2b
          ./expr2b
          inst.moved/bin/lfortran --openmp --backend=cpp expr2.F90 -o expr2c
          ./expr2c

  release:
    name: Check Release build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Test Moved Build and Installation moves the whole checkout. Keep the
      # Pixi environment, and so Kokkos and the compilers, where it was.
      - name: Detach the Pixi environment from the checkout
        shell: bash -e {0}
        run: |
          printf 'detached-environments = "%s"\n' "$RUNNER_TEMP/pixi-envs" \
            > "$RUNNER_TEMP/pixi-config.toml"
          echo "PIXI_CONFIG_FILE=$RUNNER_TEMP/pixi-config.toml" >> "$GITHUB_ENV"

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          # The Pixi builds share no cache entries with the micromamba ones.
          key: ${{ github.job }}-pixi-ubuntu-latest
          save: ${{ github.ref == 'refs/heads/main' }}

      # After ccache-action, which prepends the runner's /usr/local/bin to PATH.
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: llvm11
          activate-environment: llvm11
          cache: false

      - name: Build Linux
        shell: bash -e {0}
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
            export CXXFLAGS="-Werror"
            export CFLAGS="-Werror"
            pixi run -e llvm11 build \
              -DCMAKE_BUILD_TYPE=Release \
              -DWITH_LSP=yes \
              -DWITH_STACKTRACE=no \
              -DWITH_RUNTIME_STACKTRACE=yes \
              -DWITH_INTERNAL_ALLOC_CHECK=no \
              -DCMAKE_INSTALL_PREFIX=`pwd`/inst \
              -DCMAKE_INSTALL_BINDIR=bin/tastic \
              -DCMAKE_INSTALL_LIBDIR=oh/my/sweet/lib \
              -DCMAKE_INSTALL_INCLUDEDIR=incl/O/Matic \
              -DCMAKE_INSTALL_MANDIR=man/O/man
            cmake --build build/llvm11 --target install

      - name: Test Linux
        shell: bash -e {0}
        run: |
            pixi run -e llvm11 ctest
            pixi run -e llvm11 tests
            pixi run -e llvm11 tests -vh
            NPROC=$(nproc)
            pixi run -e llvm11 integration_tests -m
            pixi run -e llvm11 integration_tests -b llvm -j${NPROC}
            pixi run -e llvm11 integration_tests -b llvm -f -j${NPROC}
            pixi run -e llvm11 integration_tests -b llvm_single_invocation -j${NPROC}
            pixi run -e llvm11 integration_tests -b llvm --std=f23 -j${NPROC}
            pixi run -e llvm11 integration_tests -b llvm -f --std=f23 -j${NPROC}

      - name: Test Installation
        shell: bash -e {0}
        run: |
            test -x inst/bin/tastic/lfortran
            test -f inst/oh/my/sweet/lib/liblfortran_runtime_static.a
            test -f inst/oh/my/sweet/lib/liblfortran_runtime.so
            test -f inst/incl/O/Matic/lfortran/impure/lfortran_intrinsics.h
            test -f inst/man/O/man/man1/lfortran.1

      - name: Test Moved Build and Installation
        shell: bash -e {0}
        run: |
            python3 ci/test_runtime_headers.py \
              --source-dir . --build-dir build/llvm11 --install-prefix inst \
              --install-bindir bin/tastic --kokkos-dir "$CONDA_PREFIX" --relocate


