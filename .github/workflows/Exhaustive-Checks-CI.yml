  upload_tarball:
    name: Upload Tarball
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: llvm11
          cache: false

      # Generates the sources and the man page, then creates the tarball in
      # dist/ (and unpacks it, which the platform builds use).
      - name: Upload Tarball
        shell: bash -e {0}
        run: pixi run -e llvm11 shell ci/source_tarball.sh

      - name: Upload Tarball to Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash -e {0}
        run: |
          ci/upload_tarball_to_release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload_docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          # The Pixi builds share no cache entries with the micromamba ones.
          key: ${{ github.job }}-pixi-ubuntu-latest
          save: ${{ github.ref == 'refs/heads/main' }}

      # The docs environment adds Sphinx to the LLVM 11 build environment.
      # It comes after ccache-action, which prepends /usr/local/bin to PATH.
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: docs
          activate-environment: docs
          cache: false

      # doc/build.py runs the notebooks with the installed Jupyter kernel.
      - name: Build Kernel
        shell: bash -e {0}
        env:
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
        run: |
          export CXXFLAGS="-Werror -D_GLIBCXX_ASSERTIONS"
          pixi run -e docs build -DWITH_LSP=yes -DWITH_XEUS=yes \
            -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX"
          cmake --build build/docs --target install
          pixi run -e docs ctest
          jupyter kernelspec list --json

      - name: Build Docs
        shell: bash -e {0}
        working-directory: doc
        run: |
          $(command -v python) build.py

      - name: Upload Docs
        if: github.event_name == 'push'
        shell: bash -e {0}
        working-directory: doc
        run: |
          ../ci/upload_docs.sh
        env:
          SSH_PRIVATE_KEY_DOCS: ${{ secrets.SSH_PRIVATE_KEY_DOCS }}

  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      USER: lfortran
      PROJECT: lfortran
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: image-tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.USER }}/${{ env.PROJECT }}:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.USER }}/${{ env.PROJECT }}:${VERSION}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.repository == 'lfortran/lfortran' }}
          tags: ${{ steps.image-tags.outputs.tags }}

  build_xlfortran_jupyterlite:
    name: Build xlfortran JupyterLite kernel and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tasks install the wasm-host environment (emscripten-wasm32) too.
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.83.0
          environments: wasm-build lite
          cache: false

      # wasm-mods, wasm-kernel and wasm-test of pixi.toml (doc/src/jupyterlite.md).
      - name: Build the WASM kernel and run the WASM evaluator tests
        run: pixi run -e wasm-build wasm-test

      - name: Build JupyterLite site
        run: pixi run -e lite lab-build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy_jupyterlite:
    name: Deploy JupyterLite to GitHub Pages
    needs: build_xlfortran_jupyterlite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
