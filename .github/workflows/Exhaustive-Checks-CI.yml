  upload_tarball:
    name: Upload Tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux.yml
          create-args: >-
            python=3.10

      - name: Upload Tarball
        shell: bash -e -l {0}
        run: |
          ./build0.sh
          lfortran_version=$(<version)
          pandoc --standalone --to man doc/man/lfortran.md -o doc/man/lfortran.1
          ci/create_source_tarball.sh $lfortran_version

      - name: Upload Tarball to Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash -e -l {0}
        run: |
          ci/upload_tarball_to_release.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload_docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_docs_linux.yml

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          key: ${{ github.job }}-${{ matrix.os }}

      - name: Build Kernel
        shell: bash -e -l {0}
        run: |
          ./build0.sh
          export CXXFLAGS="-Werror -D_GLIBCXX_ASSERTIONS"
          cmake . -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DWITH_LLVM=yes \
            -DWITH_LSP=yes \
            -DWITH_XEUS=yes \
            -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
            -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

          ninja install
          ctest --output-on-failure
          jupyter kernelspec list --json

      - name: Build Docs
        shell: bash -e -l {0}
        working-directory: doc
        run: |
          $(command -v python) build.py

      - name: Upload Docs
        if: github.event_name == 'push'
        shell: bash -e -l {0}
        working-directory: doc
        run: |
          ../ci/upload_docs.sh
        env:
          SSH_PRIVATE_KEY_DOCS: ${{ secrets.SSH_PRIVATE_KEY_DOCS }}

  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      USER: lfortran
      PROJECT: lfortran
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: image-tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.USER }}/${{ env.PROJECT }}:latest"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.USER }}/${{ env.PROJECT }}:${VERSION}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.repository == 'lfortran/lfortran' }}
          tags: ${{ steps.image-tags.outputs.tags }}

  build_xlfortran_jupyterlite:
    name: Build xlfortran JupyterLite kernel and run tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build0 prerequisites
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment_linux.yml
          init-shell: bash
          environment-name: lf

      - name: Generate parser/ASR headers (build0.sh)
        run: ./build0.sh

      - name: Install WASM build environment
        run: micromamba create -f environment-wasm-build.yml -y

      - name: Create WASM host environment
        run: |
          set -ex
          micromamba create -f environment-wasm-host.yml -y \
            --platform=emscripten-wasm32 \
            -c https://prefix.dev/emscripten-forge-4x \
            -c https://prefix.dev/conda-forge
          echo "PREFIX=$MAMBA_ROOT_PREFIX/envs/xeus-lfortran-wasm-host" >> $GITHUB_ENV

      - name: Build native runtime .mod files
        run: ./wasm-build0.sh

      - name: Build WASM kernel
        run: micromamba run -n xeus-lfortran-wasm-build ./wasm-build1.sh

      - name: Run WASM evaluator tests
        run: |
          set -ex
          cd build-wasm/src/lfortran/tests
          micromamba run -n xeus-lfortran-wasm-build \
            node test_lfortran.js

      - name: Build JupyterLite site
        run: |
          set -ex
          micromamba create -n xeus-lite-host jupyter_server jupyterlite-xeus -c conda-forge -y
          micromamba run -n xeus-lite-host jupyter lite build \
              --XeusAddon.prefix=${{ env.PREFIX }} \
              --contents share/lfortran/nb/Demo1.ipynb \
              --contents share/lfortran/nb/Demo2.ipynb \
              --contents share/lfortran/nb/Variables.ipynb \
              --contents share/lfortran/nb/Mandelbrot.ipynb \
              --contents share/lfortran/nb/Rich_Display.ipynb \
              --contents share/lfortran/nb/marie.png \
              --output-dir dist

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy_jupyterlite:
    name: Deploy JupyterLite to GitHub Pages
    needs: build_xlfortran_jupyterlite
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
