name: Exhaustive checks label

# Explicit, rare requests for extended compiler checks, not application suites.
# Rerun the PR's existing workflow so its gate reads the current labels.
# Unrelated label events must not replace the visible Exhaustive result.
on:
  pull_request_target:
    types: [labeled, unlabeled]
    branches:
      - main

permissions:
  actions: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  rerun:
    name: Rerun Exhaustive checks
    if: github.event.label.name == 'Tests::Run-Exhaustive'
    runs-on: ubuntu-latest
    steps:
      # This privileged workflow never checks out or executes PR code.
      - name: Rerun Exhaustive checks of the PR head commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          ACTION: ${{ github.event.action }}
        run: |
          head_sha() {
            gh pr view "$PR" --json headRefOid --jq .headRefOid
          }
          run_field() {
            gh run view "$run_id" --json "$1" --jq ".$1"
          }

          sha=$(head_sha)
          run_id=$(gh run list --workflow Exhaustive-Checks-CI.yml \
            --event pull_request --commit "$sha" --limit 10 \
            --json databaseId --jq 'map(.databaseId) | max // empty')
          if [ -z "$run_id" ]; then
            echo "No Exhaustive checks run for $sha yet. It reads the labels when it starts."
            exit 0
          fi

          if [ "$(run_field status)" != completed ]; then
            if ! gh run cancel "$run_id"; then
              if [ "$(run_field status)" != completed ]; then
                echo "::error::Could not cancel run $run_id"
                exit 1
              fi
            fi
            for _ in $(seq 60); do
              [ "$(run_field status)" = completed ] && break
              sleep 5
            done
            if [ "$(run_field status)" != completed ]; then
              echo "::error::Timed out waiting for run $run_id to stop"
              exit 1
            fi
          fi

          if [ "$ACTION" = unlabeled ] && [ "$(run_field conclusion)" != cancelled ]; then
            echo "Run $run_id finished before the label was removed; keeping its results."
            exit 0
          fi

          # Do not let an old head's rerun cancel a new revision's checks.
          if [ "$(head_sha)" != "$sha" ]; then
            echo "The PR head moved on from $sha; nothing to rerun."
            exit 0
          fi

          if ! gh run rerun "$run_id"; then
            echo "::error::Cannot rerun run $run_id. Runs older than 30 days cannot be rerun: push a new commit or close and reopen the PR."
            exit 1
          fi
