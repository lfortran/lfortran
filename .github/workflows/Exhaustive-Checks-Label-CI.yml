name: Exhaustive checks label

# Starts or stops Exhaustive checks (Exhaustive-Checks-CI.yml) when the
# Tests::Run-Exhaustive label is added to or removed from a PR. That workflow
# does not run on label events itself (see the comment on its triggers).
#
# This reruns the Exhaustive checks run of the PR head commit, after
# cancelling it if it is still running. The run's `gate` job reads the
# current labels, so the rerun runs every job if the label is present and
# skips them all otherwise. A rerun stays the newest run of that workflow, so
# the PR page keeps showing it. Removing the label after the run finished
# keeps its results.
#
# GitHub reruns a run only up to 30 days after it started. For an older head
# commit, push a new commit or close and reopen the PR.
#
# pull_request_target gives a token that can rerun workflows, also on PRs
# from forks. It is safe here: this workflow does not check out or run any
# code from the PR.
on:
  pull_request_target:
    types: [labeled, unlabeled]
    branches:
      - main

permissions:
  actions: write
  pull-requests: read

# Every label change starts a run of this workflow. Keying the group by label
# keeps unrelated labels from cancelling a rerun in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  rerun:
    name: Rerun Exhaustive checks
    if: github.event.label.name == 'Tests::Run-Exhaustive'
    runs-on: ubuntu-latest
    steps:
      - name: Rerun Exhaustive checks of the PR head commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
          ACTION: ${{ github.event.action }}
        run: |
          head_sha() {
            gh pr view "$PR" --json headRefOid --jq .headRefOid
          }
          run_field() {
            gh run view "$run_id" --json "$1" --jq ".$1"
          }

          sha=$(head_sha)
          run_id=$(gh run list --workflow Exhaustive-Checks-CI.yml \
            --event pull_request --commit "$sha" --limit 10 \
            --json databaseId --jq 'map(.databaseId) | max // empty')
          if [ -z "$run_id" ]; then
            echo "No Exhaustive checks run for $sha yet. It reads the labels when it starts."
            exit 0
          fi

          # `gh run rerun` needs a completed run.
          if [ "$(run_field status)" != completed ]; then
            gh run cancel "$run_id" || true
            for _ in $(seq 60); do
              [ "$(run_field status)" = completed ] && break
              sleep 5
            done
          fi

          if [ "$ACTION" = unlabeled ] && [ "$(run_field conclusion)" != cancelled ]; then
            echo "Run $run_id finished before the label was removed; keeping its results."
            exit 0
          fi

          # Rerunning an older commit's run would cancel the run of the new
          # head (same concurrency group), which reads the labels itself.
          if [ "$(head_sha)" != "$sha" ]; then
            echo "The PR head moved on from $sha; nothing to rerun."
            exit 0
          fi

          if ! gh run rerun "$run_id"; then
            echo "::error::Cannot rerun run $run_id. Runs older than 30 days cannot be rerun: push a new commit or close and reopen the PR."
            exit 1
          fi
