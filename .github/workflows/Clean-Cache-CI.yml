name: Cleanup caches by a branch

# pull_request_target gets a token that can delete caches for PRs from forks
# (pull_request only gets a read-only token there). This workflow must never
# check out or run PR code; it only uses the PR number.
on:
  pull_request_target:
    types:
      - closed

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the PR's caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: gh cache delete --all --ref "$REF" --succeed-on-no-caches
