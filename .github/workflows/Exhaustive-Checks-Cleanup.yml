name: Exhaustive checks cleanup
# Clean (remove) skipped workflows -- Cleaner action tab, cleaner PR view.
on:
  workflow_run:
    workflows: ["Exhaustive checks"]
    types: [completed]

# Deleting a run needs `actions: write`; nothing here reads the repository.
permissions:
  actions: write

jobs:
  delete_noop_run:
    name: Delete a run that did not start the suite
    if: ${{ github.event.workflow_run.conclusion == 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete the run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          echo "deleted no-op run $RUN_ID"
