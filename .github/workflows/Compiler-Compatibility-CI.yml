name: Compiler compatibility

on:
  workflow_call:
    inputs:
      scope:
        description: "Coverage role: quick, extra, or main"
        type: string
        default: main

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: 15.0
  LFORTRAN_CI_SCOPE: ${{ inputs.scope }}
  LFORTRAN_TEST_SUITE: ${{ inputs.scope == 'quick' && 'smoke' || 'full' }}

jobs:
  test_llvm:
    name: Test LLVM ${{ matrix.llvm-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        # Quick owns the full regression modes on LLVM 11/21. Extra coverage
        # broadens the endpoint LLVM versions and macOS, without repeating it.
        # An unknown scope has no matrix, rather than silently selecting main.
        llvm-version: ${{ fromJSON('{"quick":["7","11","23"],"extra":["7","23"],"main":["7","8","10","11","15","17","18","19","21","22","23"]}')[inputs.scope] }}
        python-version: ["3.10"]
        include: ${{ inputs.scope == 'quick' && fromJSON('[]') || fromJSON('[{"os":"macos-latest","llvm-version":"22","python-version":"3.10"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pin 7.0.1: the conda-forge llvmdev 7.1.0 build is compiled with a
      # newer toolchain, and its static libraries crash at run time (in
      # createX86MCSubtargetInfo) when linked with the runner's binutils 2.42.
      - uses: mamba-org/setup-micromamba@v2.0.2
        if: matrix.llvm-version == '7'
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=${{ matrix.python-version }}
            llvmdev=7.0.1
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            openmpi=5.0.6=hb85ec53_102
            zstd-static=1.5.7

      - uses: mamba-org/setup-micromamba@v2.0.2
        if: contains(matrix.llvm-version, '10')
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=${{ matrix.python-version }}
            llvmdev=${{ matrix.llvm-version }}
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            nodejs=18.20.2
            openmpi=5.0.6=hb85ec53_102
            zlib=1.3.1
            zstd-static=1.5.6
            xonsh=0.16.0

      - uses: mamba-org/setup-micromamba@v2.0.2
        if: contains(matrix.llvm-version, '18')
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=${{ matrix.python-version }}
            llvmdev=${{ matrix.llvm-version }}
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            xonsh=0.16.0
            zlib=1.3.1
            zstd-static=1.5.6
            openmpi=5.0.6=hb85ec53_102

      - uses: mamba-org/setup-micromamba@v2.0.2
        if: contains(matrix.llvm-version, '20')
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=${{ matrix.python-version }}
            llvmdev=${{ matrix.llvm-version }}
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            openmpi=5.0.6=hb85ec53_102
            xonsh=0.16.0
            zlib=1.3.1
            zstd-static=1.5.7

      - uses: mamba-org/setup-micromamba@v2.0.2
        if: contains(matrix.llvm-version, '21')
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            llvmdev=21.1.0
            python=${{ matrix.python-version }}
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            openmpi=5.0.6=hb85ec53_102

      - uses: mamba-org/setup-micromamba@v2.0.2
        if: contains(matrix.llvm-version, '22') && contains(matrix.os, 'ubuntu')
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=${{ matrix.python-version }}
            llvmdev=${{ matrix.llvm-version }}
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            openmpi=5.0.10
            binutils=2.45.1
            zstd-static=1.5.7

      - uses: mamba-org/setup-micromamba@v2.0.2
        if: contains(matrix.llvm-version, '23') && contains(matrix.os, 'ubuntu')
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=${{ matrix.python-version }}
            llvmdev=${{ matrix.llvm-version }}
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            openmpi=5.0.10
            binutils=2.45.1
            zstd-static=1.5.7

      - uses: mamba-org/setup-micromamba@v2.0.2
        if: contains(matrix.os, 'macos')
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment.yml
          create-args: >-
            llvmdev=${{ matrix.llvm-version }}
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            openmpi=5.0.10
            zstd-static=1.5.7

      - uses: mamba-org/setup-micromamba@v2.0.2
        if: contains(matrix.llvm-version, '12')
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=${{ matrix.python-version }}
            llvmdev=${{ matrix.llvm-version }}
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            openmpi=5.0.3

      - uses: mamba-org/setup-micromamba@v2.0.2
        if: ${{! ( matrix.llvm-version == '7' || contains(matrix.llvm-version, '10') || contains(matrix.llvm-version, '12') || contains(matrix.llvm-version, '18') || contains(matrix.llvm-version, '20') || contains(matrix.llvm-version, '21') || contains(matrix.llvm-version, '22') || contains(matrix.llvm-version, '23') )}}
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=${{ matrix.python-version }}
            llvmdev=${{ matrix.llvm-version }}
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            openmpi=5.0.6=hb85ec53_102

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.llvm-version }}

      - name: Install libunwind
        if: contains(matrix.os, 'ubuntu') && (matrix.llvm-version > 11 || (inputs.scope == 'quick' && matrix.llvm-version == '11'))
        run: micromamba install -y -n lf libunwind=1.7.2

      - name: Build
        shell: bash -e -l {0}
        run: |
            ./build0.sh
            # The Quick LLVM 11 anchor uses the same runtime-stacktrace support
            # as the main Release regression job. Other main settings stay put.
            # When enabled, linking with -g requires llvm-dwarfdump and the
            # Python debug-map conversion scripts.
            STACKTRACE_FLAG=""
            if [[ "${{ matrix.llvm-version }}" != "11" && "${{ matrix.llvm-version }}" != "19" && "${{ matrix.os }}" != *macos* ]] || \
               [[ "$LFORTRAN_CI_SCOPE" == "quick" && "${{ matrix.llvm-version }}" == "11" ]]; then
                STACKTRACE_FLAG="-DWITH_RUNTIME_STACKTRACE=yes"
            fi
            cmake . -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS_RELEASE="-Wall -Wextra -O3 -funroll-loops -DNDEBUG" \
              -DWITH_LLVM=yes \
              -DWITH_LSP=yes \
              -DLFORTRAN_BUILD_ALL=yes \
              -DWITH_STACKTRACE=no \
              ${STACKTRACE_FLAG} \
              -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
              -DCMAKE_INSTALL_PREFIX=`pwd`/inst \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

            cmake --build . -j16 --target install

      - name: Test third party codes
        shell: bash -e -l {0}
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.scope == 'main' && (matrix.llvm-version == '11' || matrix.llvm-version == '19' || contains(matrix.os, 'macos')) }}
        run: |
            export PATH="$(pwd)/src/bin:$PATH"
            LAPACK_MODE="smoke"
            # The full Reference-LAPACK suite costs ~10 min more than smoke.
            # It exercises LFortran, not LLVM, so run it on the default
            # version only. LLVM 19 and macOS stay on smoke.
            if [[ "${{ matrix.llvm-version }}" == "11" ]]; then
                LAPACK_MODE="full"
            fi
            echo "Running LAPACK third-party mode: ${LAPACK_MODE}"
            RUNNER_OS="${{matrix.os}}" FC=lfortran ci/test_third_party_codes.sh --lapack-mode "${LAPACK_MODE}"

      # The unit tests exercise the JIT, whose code path differs between
      # LLVM versions, so run them for every version.
      - name: Test unit tests
        shell: bash -e -l {0}
        run: ctest --output-on-failure

      - name: Test Release reference coverage
        if: inputs.scope == 'quick' && matrix.llvm-version == '11'
        shell: bash -e -l {0}
        run: |
            export PATH="$(pwd)/src/bin:$PATH"
            ./run_tests.py
            ./run_tests.py -vh
            cd integration_tests
            ./run_tests.py -m

      - name: Test LLVM integration tests
        shell: bash -e -l {0}
        if: ${{ (inputs.scope == 'quick' && matrix.llvm-version == '11') || (inputs.scope == 'extra' && contains(matrix.os, 'macos')) || (matrix.llvm-version != '11' && matrix.llvm-version != '19' && !contains(matrix.os, 'macos')) }}
        run: |
            export PATH="$(pwd)/src/bin:$PATH"
            export LFORTRAN_LLVM_VERSION="${{ matrix.llvm-version }}"
            if [[ "${{ matrix.os }}" == *macos* ]]; then
                export WIN=0 MACOS=1 LFORTRAN_TEST_SUITE=full
                shell ci/test.sh
            elif [[ "$LFORTRAN_CI_SCOPE" == "quick" && "$LFORTRAN_LLVM_VERSION" == "11" ]]; then
                bash ci/test_llvm_integration.sh --core
            else
                bash ci/test_llvm_integration.sh
            fi

      - name: Test coarray runtime with Caffeine
        if: ${{ inputs.scope != 'quick' || matrix.llvm-version == '11' }}
        shell: bash -e -l {0}
        run: ci/test_caffeine.sh --verify-all-passes

  test_llvm_wasm:
    name: Test LLVM 19 WASM (ubuntu-latest)
    if: inputs.scope == 'quick' || inputs.scope == 'main'
    runs-on: ubuntu-latest
    # llvm_wasm / llvm_wasm_emcc need a Debug build with WITH_TARGET_WASM.
    # Kept separate from Test LLVM 19 so third-party codes use a Release
    # compiler.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=3.10
            llvmdev=19
            bison=3.4
            openblas=0.3.21
            llvm-openmp=14.0.4
            make=4.3
            nodejs=18.20.4
            openmpi=5.0.6=hb85ec53_102
            xonsh=0.16.0
            zlib=1.3.1
            zstd-static=1.5.6

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          key: ${{ github.job }}-ubuntu-latest-19

      - name: Install libunwind
        run: micromamba install -y -n lf libunwind=1.7.2

      - name: Setup WASI SDK
        shell: bash -e -l {0}
        run: |
          mkdir -p $HOME/ext
          cd $HOME/ext
          curl -o wasi-sdk.tar.gz -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-21/wasi-sdk-21.0-linux.tar.gz
          tar -xvf wasi-sdk.tar.gz
          mv wasi-sdk-21.0 wasi-sdk
          export WASI_SDK_PATH=$HOME/ext/wasi-sdk
          echo $WASI_SDK_PATH
          $WASI_SDK_PATH/bin/clang --version

      - name: Install wasmtime
        shell: bash -e -l {0}
        run: |
          cd $HOME
          curl -o wasmtime.tar.gz -L https://github.com/bytecodealliance/wasmtime/releases/download/v19.0.2/wasmtime-v19.0.2-x86_64-linux.tar.xz
          tar -xvf wasmtime.tar.gz
          export PATH=$HOME/wasmtime-v19.0.2-x86_64-linux:$PATH
          wasmtime --version

      - name: Setup Emscripten SDK
        shell: bash -e -l {0}
        run: |
          mkdir -p $HOME/ext
          cd $HOME/ext
          curl -o emsdk.tar.gz -L https://github.com/emscripten-core/emsdk/archive/refs/tags/4.0.13.tar.gz
          tar -xvf emsdk.tar.gz
          mv emsdk-4.0.13 emsdk
          export EMSDK_PATH=$HOME/ext/emsdk
          echo $EMSDK_PATH
          cd $EMSDK_PATH
          ./emsdk install 3.1.35
          ./emsdk activate 3.1.35

      - name: Build Linux ( WASM )
        shell: bash -e -l {0}
        run: |
            export WASI_SDK_PATH=$HOME/ext/wasi-sdk
            export EMSDK_PATH=$HOME/ext/emsdk
            export CXXFLAGS="-Werror -D_GLIBCXX_ASSERTIONS"
            ./build0.sh
            cmake . -GNinja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DWITH_LLVM=yes \
              -DWITH_LSP=yes \
              -DWITH_TARGET_WASM=yes \
              -DLFORTRAN_BUILD_ALL=yes \
              -DWITH_STACKTRACE=no \
              -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
              -DCMAKE_INSTALL_PREFIX=`pwd`/inst \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

            cmake --build . -j16 --target install

      - name: Test unit tests
        shell: bash -e -l {0}
        run: ctest --output-on-failure

      - name: Test Linux ( WASM )
        shell: bash -e -l {0}
        run: |
            export WASI_SDK_PATH=$HOME/ext/wasi-sdk
            export EMSDK_PATH=$HOME/ext/emsdk
            export PATH=$HOME/wasmtime-v19.0.2-x86_64-linux:$PATH
            export WASMTIME_NEW_CLI=0
            cd integration_tests
            ./run_tests.py -b llvm_wasm llvm_wasm_emcc

  test_without_llvm:
    name: Test without LLVM Backend
    if: inputs.scope == 'quick' || inputs.scope == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux.yml
          create-args: >-
            python=3.10

      - name: Test
        shell: bash -e -l {0}
        run: |
          shell ci/test_without_llvm_backend.sh

  test_mlir:
    name: Test MLIR backend
    if: inputs.scope == 'quick' || inputs.scope == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v2.0.2
        with:
          micromamba-version: '2.0.4-0'
          environment-file: ci/environment_linux_llvm.yml
          create-args: >-
            python=3.10
            mlir=19.1.6
            llvm=19.1.6
            llvm-openmp=19.1.6
            libunwind=1.7.2

      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          key: ${{ github.job }}-${{ matrix.os }}

      - name: Build Linux
        shell: bash -e -l {0}
        run: |
            ./build0.sh
            cmake . -GNinja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DWITH_LLVM=yes \
              -DWITH_LSP=yes \
              -DWITH_MLIR=yes \
              -DLFORTRAN_BUILD_ALL=yes \
              -DWITH_STACKTRACE=no \
              -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
              -DCMAKE_INSTALL_PREFIX=`pwd`/inst \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

            cmake --build . -j16 --target install

      - name: Test unit tests
        shell: bash -e -l {0}
        run: ctest --output-on-failure

      - name: Test Linux
        shell: bash -e -l {0}
        run: |
            cd integration_tests
            ./run_tests.py -b mlir -j1
